    <script>
      (function() {
        // Suppress benign fetch setter error in environments where window.fetch is getter-only
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch of #<Window>') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (window.Window && window.Window.prototype) {
              var _protoFetch = window.Window.prototype.fetch;
              Object.defineProperty(window.Window.prototype, 'fetch', {
                get: function() {
                  return _protoFetch;
                },
                set: function(val) {
                  _protoFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        }
      })();
    </script>
